<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/api_playground/">
    <title>API Playground - Resume Profile Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-hover: #475569;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --border-color: #334155;
            --success: #22c55e;
            --warning: #eab308;
            --error: #ef4444;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .playground-header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .playground-header h1 {
            color: var(--accent-primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .token-status {
            display: flex;
            align-items: center;
        }

        .token-status-inner {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .token-badge {
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .token-none {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .token-active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .token-clear-btn {
            padding: 0.3rem 0.6rem;
            background: transparent;
            border: 1px solid var(--error);
            border-radius: var(--radius-sm);
            color: var(--error);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .token-clear-btn:hover {
            background: var(--error);
            color: white;
        }

        .connection-config {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .connection-config label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .connection-config input {
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            min-width: 280px;
        }

        .refresh-btn {
            padding: 0.5rem 1.2rem;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        .loading-indicator {
            margin-top: 1rem;
            color: var(--accent-primary);
            font-size: 0.9rem;
        }

        .error-banner {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: var(--radius-sm);
            color: var(--error);
        }

        /* Layout */
        .playground-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .playground-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .main-content {
            display: grid;
            grid-template-rows: 1fr 1fr;
            overflow: hidden;
        }

        .builder-panel {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .response-panel {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-top: 2px solid var(--accent-primary);
        }

        /* Endpoint Browser */
        .endpoint-browser {
            padding: 1rem;
        }

        .browser-header {
            margin-bottom: 1.5rem;
        }

        .browser-header h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .base-url-input {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .endpoint-group {
            margin-bottom: 0.5rem;
        }

        .group-header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .group-header:hover {
            background: var(--bg-hover);
        }

        .group-title {
            flex: 1;
            text-align: left;
        }

        .group-count {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .expand-icon {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .endpoints-list {
            margin-top: 0.25rem;
            padding-left: 0.5rem;
        }

        .endpoint-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.25rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .endpoint-item:hover {
            background: var(--bg-secondary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .endpoint-item .endpoint-summary {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Method Badges */
        .method-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            min-width: 50px;
            text-align: center;
        }

        .method-get {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-primary);
        }

        .method-post {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .method-put {
            background: rgba(234, 179, 8, 0.15);
            color: var(--warning);
        }

        .method-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .method-patch {
            background: rgba(129, 140, 248, 0.15);
            color: var(--accent-secondary);
        }

        .endpoint-path {
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .endpoint-summary {
            font-size: 0.8rem;
            color: var(--text-muted);
            flex: 1;
        }

        /* Request Builder */
        .request-builder {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            overflow-x: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .builder-header {
            margin-bottom: 1.5rem;
        }

        .builder-header h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .endpoint-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .params-section {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .params-section h4 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .param-field {
            margin-bottom: 1rem;
        }

        .param-field:last-child {
            margin-bottom: 0;
        }

        .param-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .required {
            color: var(--error);
            margin-left: 0.25rem;
        }

        .param-field input,
        .param-field textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
        }

        .param-field input:focus,
        .param-field textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .body-description {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .body-textarea {
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.85rem;
            resize: vertical;
        }

        .builder-actions {
            margin-top: 1rem;
        }

        .send-btn {
            padding: 0.75rem 2rem;
            background: var(--success);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: var(--radius-sm);
            color: var(--error);
            font-size: 0.9rem;
        }

        .no-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        /* Response Viewer */
        .response-viewer {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: -1.5rem -1.5rem 1rem -1.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.1) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .response-header h3 {
            font-size: 1rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .token-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin: -1.0rem -1.5rem 1rem -1.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(56, 189, 248, 0.08);
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .token-banner-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .token-banner-text code {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.8rem;
            color: var(--accent-primary);
        }

        .token-banner-actions {
            display: flex;
            gap: 0.5rem;
        }

        .token-use-btn {
            padding: 0.35rem 0.8rem;
            background: var(--success);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .token-use-btn:hover {
            opacity: 0.9;
        }

        .token-dismiss-btn {
            padding: 0.35rem 0.8rem;
            background: transparent;
            border: 1px solid var(--text-muted);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .token-dismiss-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-code {
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .status-redirect {
            background: rgba(234, 179, 8, 0.2);
            color: var(--warning);
        }

        .status-client-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .status-server-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .status-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .response-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            padding: 0.4rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active,
        .tab-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .response-content {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .response-body {
            padding: 1rem;
            overflow-x: auto;
            margin: 0;
        }

        .response-body code {
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .headers-list {
            padding: 1rem;
        }

        .header-item {
            display: flex;
            gap: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .header-item:last-child {
            border-bottom: none;
        }

        .header-name {
            color: var(--accent-primary);
            font-weight: 600;
            min-width: 200px;
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.85rem;
        }

        .header-value {
            color: var(--text-secondary);
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.85rem;
        }

        .no-response {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        /* Schema Form Styles */
        .schema-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .schema-form-empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 0.5rem 0;
        }

        .schema-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .schema-field-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .schema-field-label .field-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .required-indicator {
            color: var(--error);
            font-weight: 700;
        }

        .optional-indicator {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .field-description {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: normal;
            width: 100%;
        }

        .schema-input {
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
        }

        .schema-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .schema-number {
            font-family: 'Fira Code', 'Monaco', monospace;
        }

        .schema-textarea {
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            width: 100%;
        }

        .schema-field-checkbox {
            flex-direction: row;
            align-items: center;
            gap: 0.75rem;
        }

        .schema-checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        .schema-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-primary);
        }

        /* Object nesting */
        .schema-field-object {
            border-left: 2px solid var(--border-color);
            padding-left: 1rem;
            margin-left: 0.25rem;
        }

        .schema-object-container {
            padding: 0.5rem 0;
        }

        .schema-field-depth-1 {
            border-color: var(--accent-primary);
        }

        .schema-field-depth-2 {
            border-color: var(--accent-secondary);
        }

        .schema-field-depth-3 {
            border-color: var(--success);
        }

        /* Array fields */
        .schema-array {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .array-add-btn {
            align-self: flex-start;
            padding: 0.4rem 1rem;
            background: var(--bg-hover);
            border: 1px dashed var(--accent-primary);
            border-radius: var(--radius-sm);
            color: var(--accent-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .array-add-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .array-items {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .array-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
        }

        .array-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .array-item-index {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .array-remove-btn {
            padding: 0.2rem 0.6rem;
            background: transparent;
            border: 1px solid var(--error);
            border-radius: var(--radius-sm);
            color: var(--error);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .array-remove-btn:hover {
            background: var(--error);
            color: white;
        }

        .array-item-content {
            padding-left: 0.5rem;
        }

        /* Schema debug fallback */
        .schema-form-empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 0.5rem 0;
        }

        .schema-form-empty p {
            margin-bottom: 0.5rem;
        }

        .schema-debug {
            margin-top: 0.5rem;
        }

        .schema-debug summary {
            color: var(--accent-primary);
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }

        .schema-debug pre {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow-x: auto;
        }

        .schema-debug code {
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-hover);
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module">
        import init from './api_playground.js';
        init();
    </script>
</body>

</html>
